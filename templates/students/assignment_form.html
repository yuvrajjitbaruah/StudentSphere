{% extends "base.html" %}

{% block content %}
<section class="card glass-card form-card">
    <h2>New Assignment</h2>
    <p class="muted-text">Assignments are matched to students by course name or year, so keep both accurate.</p>
    <form method="post" enctype="multipart/form-data" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-row">
            <button type="submit" class="btn-primary">Publish Assignment</button>
            <a href="{% url 'assignment_list' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
