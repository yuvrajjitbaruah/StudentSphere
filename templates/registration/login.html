{% extends "base.html" %}

{% block content %}
<section class="card auth-card glass-card">
    <h2>Welcome Back</h2>
    <p>Sign in to continue to your student management dashboard.</p>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <p class="muted-text">Shortcut: press <code>c</code> after login to quickly open Support AI.</p>
    <p class="muted-text">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
